name: Update Streak Badge
on:
  schedule:
    - cron: '0 0 * * *' 
  push:
    branches:
      - main

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run streak calculator
        run: python scripts/update_streak.py
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add streak.json
          git commit -m "Automated streak update" || exit 0
          git push